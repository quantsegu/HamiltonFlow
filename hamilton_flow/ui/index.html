<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HamiltonFlow Explorer</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--mute:#6b6b66;--line:#e3e3df;--accent:#3d5afe;--ok:#1b7f4b;--warn:#b26a00;--err:#c62828;--chip:#eef0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141415;--panel:#1d1d1f;--ink:#ececea;--mute:#9a9a95;--line:#2e2e31;--accent:#8c9eff;--ok:#5fcf93;--warn:#f0b04a;--err:#ff7b72;--chip:#262a4a}}
:root[data-theme=dark]{--bg:#141415;--panel:#1d1d1f;--ink:#ececea;--mute:#9a9a95;--line:#2e2e31;--accent:#8c9eff;--ok:#5fcf93;--warn:#f0b04a;--err:#ff7b72;--chip:#262a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .sp{flex:1}
.app{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 50px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto}
main{padding:16px;min-width:0}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 0 6px}
h2:first-child{margin-top:0}
label.item{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.badge{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--chip);color:var(--accent);white-space:nowrap}
.muted{color:var(--mute)}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#101018}}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute)}
.tab.on{color:var(--ink);border-color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);background:var(--bg)}
td.num{text-align:right}
.scroll{overflow:auto}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;overflow:auto;font-size:12.5px;margin:0}
.err{border:1px solid var(--err);border-radius:6px;padding:10px 12px;background:var(--panel)}
.err b{color:var(--err)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.stage h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.node{border:1px solid var(--line);border-radius:6px;padding:5px 7px;margin-bottom:6px;font-size:12.5px}
.node .ms{float:right;font-variant-numeric:tabular-nums}
.node.skipped{opacity:.55;border-style:dashed}
.node.bad{border-color:var(--err)}
.bar{height:3px;background:var(--accent);border-radius:2px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--chip);color:var(--accent);padding:2px 8px;border-radius:12px;font-size:12px}
.pill{padding:2px 8px;border-radius:12px;font-size:12px;border:1px solid var(--line)}
.pill.hit{color:var(--ok);border-color:var(--ok)}.pill.miss{color:var(--warn);border-color:var(--warn)}

nav{display:flex;gap:2px}
nav button{border:0;background:none;padding:6px 12px;border-radius:6px;color:var(--mute);cursor:pointer}
nav button.on{background:var(--chip);color:var(--accent)}
[hidden]{display:none!important}
.builder{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.f{display:flex;flex-direction:column;gap:3px}.f>span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.line{display:grid;gap:6px;grid-template-columns:1.2fr 1fr 1.4fr 32px;margin-bottom:6px;align-items:center}
.line.dim{grid-template-columns:1.2fr 1fr 1fr 1.4fr 32px}
.line.inp{grid-template-columns:1.4fr 1fr 1fr 32px}
button.sm{padding:3px 9px;font-size:12px}
button.x{padding:2px 8px;color:var(--err)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mute)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;z-index:5}
.savebar .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.issue{color:var(--err)}.issue.info{color:var(--mute)}.ok{color:var(--ok)}
.tree{font-size:12px;color:var(--mute)}
.two{display:grid;gap:14px;grid-template-columns:minmax(260px,340px) 1fr}
@media(max-width:800px){.two{grid-template-columns:1fr}.line,.line.dim,.line.inp{grid-template-columns:1fr 1fr}}
code.k{background:var(--bg);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>HamiltonFlow Explorer</h1><span class="muted" id="summary"></span><nav id="nav"><button data-view="explore" class="on">Explore</button><button data-view="data" hidden>Data &amp; models</button><button data-view="metrics" hidden>Metrics</button></nav><span class="sp"></span>
  <button id="theme" title="Toggle theme">Theme</button>
</header>
<div class="app" id="view-explore">
<aside>
  <h2>Metrics</h2><div id="metrics" class="muted">Loading…</div>
  <h2>Group by</h2><div id="dims" class="muted">Select a metric</div>
  <h2>Filter</h2>
  <textarea id="where" placeholder="{{ Dimension('order__status') }} = 'paid'"></textarea>
  <h2>Time range</h2>
  <div class="row"><input type="datetime-local" id="t0" aria-label="Start"><input type="datetime-local" id="t1" aria-label="End"></div>
  <h2>Order &amp; limit</h2>
  <div class="row"><input type="text" id="order" placeholder="-revenue, customer__country"><input type="number" id="limit" min="0" placeholder="limit"></div>
  <div class="row" style="margin-top:14px"><button id="explain">Explain</button><button id="run" class="primary">Run query</button></div>
</aside>
<main>
  <div class="status" id="status"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
</div>
<section id="view-data" class="builder" hidden></section>
<section id="view-metrics" class="builder" hidden></section>
<div class="savebar" id="bar" hidden><div class="in">
  <span id="bar-status"></span><span class="sp" style="flex:1"></span>
  <button id="show-yaml" class="sm">View YAML</button>
  <button id="save" class="primary">Save &amp; apply</button>
</div><pre id="yaml" hidden style="max-width:1100px;margin:10px auto 0;max-height:220px"></pre></div>
<script>
const $=s=>document.querySelector(s);
const state={metrics:[],selected:new Set(),groups:new Set(),tab:'Results',data:null,error:null,lineage:[]};
const STAGES=['ingest','parse','validate','plan','render','execute','check'];
const GRAINS=['day','week','month','quarter','year'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path,body){
  const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  return {ok:r.ok,status:r.status,json:await r.json()};
}
function buildRequest(){
  const req={metric_names:[...state.selected]};
  if(state.groups.size)req.group_by_names=[...state.groups];
  const w=$('#where').value.trim(); if(w)req.where_constraints=[w];
  const o=$('#order').value.split(',').map(s=>s.trim()).filter(Boolean); if(o.length)req.order_by_names=o;
  if($('#limit').value!=='')req.limit=Number($('#limit').value);
  if($('#t0').value)req.time_constraint_start=$('#t0').value;
  if($('#t1').value)req.time_constraint_end=$('#t1').value;
  return req;
}
function common(){
  const sel=state.metrics.filter(m=>state.selected.has(m.name));
  if(!sel.length)return [];
  const maps=sel.map(m=>new Map(m.dimensions.map(d=>[d.name,d])));
  return [...maps[0].values()].filter(d=>maps.every(m=>m.has(d.name)));
}
function renderMetrics_explore(){
  $('#metrics').innerHTML=state.metrics.map(m=>`<label class="item"><input type="checkbox" data-m="${esc(m.name)}" ${state.selected.has(m.name)?'checked':''}><span>${esc(m.name)} <span class="badge">${esc(m.type)}</span>${m.description?`<br><span class="muted">${esc(m.description)}</span>`:''}</span></label>`).join('')||'No metrics';
  document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{e.checked?state.selected.add(e.dataset.m):state.selected.delete(e.dataset.m);
    const ok=new Set(common().map(d=>d.name));[...state.groups].forEach(g=>{if(!ok.has(g)&&!ok.has(base(g)+'__day')&&![...ok].some(n=>base(n)===base(g)))state.groups.delete(g)});renderDims()});
}
const base=n=>{const i=n.lastIndexOf('__');return GRAINS.includes(n.slice(i+2))?n.slice(0,i):n};
function renderDims(){
  const dims=common(), seen=new Set(), out=[];
  for(const d of dims){
    const b=d.type==='time'?base(d.name):d.name; if(seen.has(b))continue; seen.add(b);
    if(d.type==='time'){
      const cur=[...state.groups].find(g=>base(g)===b);
      const g=cur?cur.slice(b.length+2):'';
      out.push(`<div class="row" style="align-items:center;margin:3px 0"><label class="item" style="flex:2"><input type="checkbox" data-t="${esc(b)}" ${cur?'checked':''}><span>${esc(b)} <span class="badge">time</span></span></label><select data-g="${esc(b)}" ${cur?'':'disabled'}>${GRAINS.map(x=>`<option ${x===(g||'day')?'selected':''}>${x}</option>`).join('')}</select></div>`);
    } else out.push(`<label class="item"><input type="checkbox" data-d="${esc(d.name)}" ${state.groups.has(d.name)?'checked':''}><span>${esc(d.name)}</span></label>`);
  }
  $('#dims').innerHTML=out.join('')||'<span class="muted">Select a metric</span>';
  document.querySelectorAll('[data-d]').forEach(e=>e.onchange=()=>{e.checked?state.groups.add(e.dataset.d):state.groups.delete(e.dataset.d)});
  const setTime=b=>{[...state.groups].filter(g=>base(g)===b).forEach(g=>state.groups.delete(g));
    const on=document.querySelector(`[data-t="${CSS.escape(b)}"]`).checked, sel=document.querySelector(`[data-g="${CSS.escape(b)}"]`);
    sel.disabled=!on; if(on)state.groups.add(b+'__'+sel.value)};
  document.querySelectorAll('[data-t]').forEach(e=>e.onchange=()=>setTime(e.dataset.t));
  document.querySelectorAll('[data-g]').forEach(e=>e.onchange=()=>setTime(e.dataset.g));
}
function fmt(v){return typeof v==='number'?(Number.isInteger(v)?v.toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:4})):esc(v??'')}
function statusBar(){
  const d=state.data, el=$('#status'); el.innerHTML='';
  if(d?.run){const c=d.run.cache; el.innerHTML+=c?`<span class="pill ${c}">cache ${c}</span>`:'<span class="pill">cache off</span>';
    const ms=d.run.nodes.reduce((a,n)=>a+n.ms,0); el.innerHTML+=`<span class="pill">${ms.toFixed(1)} ms in DAG</span>`}
  if(d?.row_count!=null)el.innerHTML+=`<span class="pill">${d.row_count} row${d.row_count===1?'':'s'}${d.truncated?' (truncated)':''}</span>`;
}
function view(){
  const tabs=['Results','SQL','Pipeline'];
  $('#tabs').innerHTML=tabs.map(t=>`<div class="tab ${t===state.tab?'on':''}" data-tab="${t}">${t}</div>`).join('');
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;view()});
  statusBar();
  const v=$('#view');
  if(state.error){const e=state.error.error||{};v.innerHTML=`<div class="err"><b>${esc(e.kind||'error')} error</b> <span class="muted">(${esc(e.type||'')})</span><pre style="border:0;padding:6px 0 0;white-space:pre-wrap">${esc(e.message||JSON.stringify(state.error))}</pre></div>`;return}
  const d=state.data; if(!d){v.innerHTML='<p class="muted">Pick metrics and run a query.</p>';return}
  if(state.tab==='Results'){
    if(!d.rows){v.innerHTML='<p class="muted">Explain only: no results. Use Run query.</p>';return}
    v.innerHTML=`<div class="scroll"><table><thead><tr>${d.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${d.columns.map(c=>`<td class="${typeof r[c]==='number'?'num':''}">${fmt(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(state.tab==='SQL'){
    v.innerHTML=`<pre>${esc(d.sql)}</pre><p><button id="copy">Copy SQL</button> <span class="muted">dialect: ${esc(d.dialect||'')}</span></p>`;
    $('#copy').onclick=()=>navigator.clipboard?.writeText(d.sql);
  } else {
    const ran=new Map((d.run?.nodes||[]).map(n=>[n.node,n])), max=Math.max(1,...[...ran.values()].map(n=>n.ms));
    v.innerHTML=`<div class="pipe">${STAGES.map(s=>`<div class="stage"><h3>${s}</h3>${state.lineage.filter(n=>n.stage===s).map(n=>{const r=ran.get(n.node);
      return `<div class="node ${r?(r.ok?'':'bad'):'skipped'}" title="depends on: ${esc(n.depends_on.join(', ')||'inputs')}"><span class="ms">${r?r.ms.toFixed(1)+' ms':'skipped'}</span>${esc(n.node)}${r?`<div class="bar" style="width:${Math.max(2,r.ms/max*100)}%"></div>`:''}</div>`}).join('')}</div>`).join('')}</div>
      <p class="muted">Dashed nodes did not run${d.run?.cache==='hit'?': the compiled SQL came from the cache.':'.'} Hover a node for its dependencies.</p>`;
  }
}
async function go(kind){
  if(!state.selected.size){state.error={error:{kind:'request',message:'Select at least one metric.'}};state.data=null;view();return}
  $('#run').disabled=$('#explain').disabled=true;
  const r=await api(kind==='run'?'/query':'/explain',buildRequest());
  $('#run').disabled=$('#explain').disabled=false;
  if(r.ok){state.data=r.json;state.error=null;state.tab=kind==='run'?'Results':'SQL'}else{state.error=r.json;state.data=null}
  view();
}
$('#run').onclick=()=>go('run'); $('#explain').onclick=()=>go('explain');
$('#theme').onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#141415';r.dataset.theme=dark?'light':'dark'};

/* ---------------- Builder ---------------- */
const B={on:false,spec:{semantic_models:[],metrics:[]},tables:[],issues:[],yaml:'',dirty:false,opts:{aggregations:[],metric_types:[],grains:[]},view:'explore',timer:null,preview:null};
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
function setp(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const opt=(vals,cur,blank)=>(blank!=null?`<option value="">${esc(blank)}</option>`:'')+vals.map(v=>{const [val,lab]=Array.isArray(v)?v:[v,v];return `<option value="${esc(val)}" ${val===cur?'selected':''}>${esc(lab)}</option>`}).join('');
const inp=(path,label,ph='',type='text')=>`<label class="f"><span>${label}</span><input type="${type}" data-p="${path}" value="${esc(get(B.spec,path)??'')}" placeholder="${esc(ph)}"></label>`;
const sel=(path,label,options,blank)=>`<label class="f"><span>${label}</span><select data-p="${path}">${opt(options,get(B.spec,path)??'',blank)}</select></label>`;

function touch(){B.dirty=true;clearTimeout(B.timer);B.timer=setTimeout(recheck,350);barUpdate()}
async function recheck(){const r=await api('/builder/check',{spec:B.spec});if(r.ok){B.issues=r.json.issues;B.yaml=r.json.yaml}else B.issues=[{level:'error',message:r.json.error?.message||'Check failed'}];barUpdate()}
function barUpdate(){
  $('#bar').hidden=!(B.on&&B.view!=='explore');
  const errs=B.issues.filter(i=>i.level==='error'),info=B.issues.filter(i=>i.level==='info');
  const empty=!B.spec.metrics.length;
  $('#bar-status').innerHTML=errs.length?`<span class="issue">${esc(errs[0].message)}</span>`:info.length?`<span class="issue info">${esc(info[0].message)}</span>`:B.dirty?'<span class="ok">Model is valid. Unsaved changes.</span>':'<span class="muted">All changes saved and applied.</span>';
  $('#save').disabled=!!errs.length||empty||!B.dirty;
  $('#yaml').textContent=B.yaml;
}
function bindInputs(root){
  root.querySelectorAll('[data-p]').forEach(e=>{const h=()=>{setp(B.spec,e.dataset.p,e.value);touch()};e.oninput=h;if(e.tagName==='SELECT')e.onchange=h});
  root.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>actions[e.dataset.act]?.(e.dataset));
}
const rerender=()=>{renderData();renderMetrics()};

/* Data tab */
function renderData(){
  const root=$('#view-data');
  const tables=B.tables.map(t=>{const used=B.spec.semantic_models.some(m=>m.table===t.table);
    return `<div class="card"><h3>${esc(t.table)} ${used?'<span class="badge">modeled</span>':''}<span class="sp" style="flex:1"></span>
      <button class="sm" data-act="preview" data-t="${esc(t.table)}">Preview</button>
      <button class="sm primary" data-act="model" data-t="${esc(t.table)}">${used?'Re-draft model':'Model this table'}</button>
      <button class="sm x" data-act="drop" data-t="${esc(t.table)}" title="Drop table">✕</button></h3>
      <div class="chips">${t.columns.map(c=>`<span class="chip">${esc(c.name)} <span class="muted">${esc(c.type)}</span></span>`).join('')}</div></div>`}).join('')||'<p class="muted">No tables yet. Upload a CSV, Parquet or JSON file.</p>';
  const models=B.spec.semantic_models.map((m,i)=>modelCard(m,i)).join('')||'<p class="muted">Model a table to define entities, dimensions and measures.</p>';
  root.innerHTML=`<div class="two"><div>
    <h2>Data inputs</h2>
    <div class="card"><div class="drop" id="drop">Drop a file here or <label style="color:var(--accent);cursor:pointer">choose<input type="file" id="file" accept=".csv,.tsv,.parquet,.json,.jsonl,.ndjson" hidden></label><br><span class="muted">CSV, TSV, Parquet, JSON (max 50 MB)</span></div>
      <div class="row" style="margin-top:8px;align-items:end"><label class="f"><span>Table name</span><input type="text" id="tname" placeholder="orders"></label><label class="item" style="flex:0 0 auto"><input type="checkbox" id="replace"> replace</label></div>
      <div id="upmsg" class="muted" style="margin-top:6px"></div></div>
    ${tables}</div>
    <div><h2>Semantic models</h2>${models}${B.preview?previewCard():''}</div></div>`;
  bindInputs(root);
  const drop=$('#drop'),file=$('#file');
  const pick=f=>{if(!f)return;if(!$('#tname').value)$('#tname').value=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9_]/g,'_').replace(/^(\d)/,'t_$1');upload(f)};
  file.onchange=()=>pick(file.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');pick(e.dataTransfer.files[0])};
}
function previewCard(){const p=B.preview;return `<div class="card"><h3>Preview: ${esc(p.table)} <span class="muted">${p.row_count} rows</span></h3><div class="scroll"><table><thead><tr>${p.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${p.rows.map(r=>`<tr>${p.columns.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function modelCard(m,i){
  const P=`semantic_models.${i}`,timeDims=(m.dimensions||[]).filter(d=>d.type==='time').map(d=>d.name);
  return `<div class="card"><h3>${esc(m.name)||'(unnamed)'} <span class="badge">${esc(m.table)}</span><span style="flex:1"></span><button class="sm x" data-act="rmmodel" data-i="${i}">Remove</button></h3>
  <div class="grid">${inp(P+'.name','Name','orders')}${inp(P+'.table','Table','main.orders')}${sel(P+'.agg_time_dimension','Aggregation time',timeDims,'(none)')}</div>
  <h2>Entities <span class="muted">keys that join models</span></h2>${(m.entities||[]).map((e,j)=>`<div class="line"><input data-p="${P}.entities.${j}.name" value="${esc(e.name)}" placeholder="name"><select data-p="${P}.entities.${j}.type">${opt(['primary','unique','foreign','natural'],e.type)}</select><input data-p="${P}.entities.${j}.expr" value="${esc(e.expr||'')}" placeholder="column or SQL"><button class="sm x" data-act="rm" data-k="entities" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
  <button class="sm" data-act="add" data-k="entities" data-i="${i}">+ Entity</button>
  <h2>Dimensions <span class="muted">what you can group and filter by</span></h2>${(m.dimensions||[]).map((d,j)=>`<div class="line dim"><input data-p="${P}.dimensions.${j}.name" value="${esc(d.name)}" placeholder="name"><select data-p="${P}.dimensions.${j}.type">${opt(['categorical','time'],d.type)}</select><select data-p="${P}.dimensions.${j}.granularity" ${d.type==='time'?'':'disabled'}>${opt(B.opts.grains,d.granularity||'day')}</select><input data-p="${P}.dimensions.${j}.expr" value="${esc(d.expr||'')}" placeholder="column or SQL"><button class="sm x" data-act="rm" data-k="dimensions" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
  <button class="sm" data-act="add" data-k="dimensions" data-i="${i}">+ Dimension</button>
  <h2>Measures <span class="muted">numbers that metrics aggregate</span></h2>${(m.measures||[]).map((x,j)=>`<div class="line"><input data-p="${P}.measures.${j}.name" value="${esc(x.name)}" placeholder="name"><select data-p="${P}.measures.${j}.agg">${opt(B.opts.aggregations,x.agg)}</select><input data-p="${P}.measures.${j}.expr" value="${esc(x.expr||'')}" placeholder="column or SQL"><button class="sm x" data-act="rm" data-k="measures" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
  <button class="sm" data-act="add" data-k="measures" data-i="${i}">+ Measure</button></div>`;
}
async function upload(f){
  const name=$('#tname').value.trim(),msg=$('#upmsg');msg.textContent='Uploading…';
  const r=await fetch(`/builder/upload?filename=${encodeURIComponent(f.name)}&table=${encodeURIComponent(name)}&replace=${$('#replace').checked}`,{method:'POST',body:await f.arrayBuffer()});
  const j=await r.json();
  if(!r.ok){msg.innerHTML=`<span class="issue">${esc(j.error?.message||'Upload failed')}</span>`;return}
  await loadState(true);$('#upmsg').textContent=`Loaded ${j.table} (${j.columns.length} columns).`;
}
const actions={
  async model({t}){const r=await api('/builder/suggest',{table:t});if(!r.ok)return;const d=r.json;
    const i=B.spec.semantic_models.findIndex(m=>m.table===t);i>=0?B.spec.semantic_models[i]=d.semantic_model:B.spec.semantic_models.push(d.semantic_model);
    for(const m of d.metrics){if(!B.spec.metrics.some(x=>x.name===m.name))B.spec.metrics.push(m)}
    touch();rerender();if(d.needs_time_dimension)$('#bar-status').innerHTML='<span class="issue">This table has no date column, so measures cannot be aggregated over time. Add a time dimension.</span>'},
  async preview({t}){const [s,n]=t.split('.');const r=await api(`/builder/tables/${s}/${n}`);if(r.ok){B.preview={...r.json,table:t};renderData()}},
  async drop({t}){if(!confirm(`Drop table ${t}? This deletes its data.`))return;const [s,n]=t.split('.');await fetch(`/builder/tables/${s}/${n}`,{method:'DELETE'});B.preview=null;await loadState(true)},
  rmmodel({i}){B.spec.semantic_models.splice(+i,1);touch();rerender()},
  add({k,i}){const m=B.spec.semantic_models[+i];(m[k]??=[]).push(k==='entities'?{name:'',type:'foreign',expr:''}:k==='dimensions'?{name:'',type:'categorical',expr:'',granularity:'day'}:{name:'',agg:'sum',expr:''});touch();renderData()},
  rm({k,i,j}){B.spec.semantic_models[+i][k].splice(+j,1);touch();renderData()},
  /* metrics */
  newmetric({type}){B.spec.metrics.push(blankMetric(type));touch();renderMetrics()},
  rmmetric({i}){const n=B.spec.metrics[+i].name;const users=B.spec.metrics.filter(m=>dependsOn(m).includes(n)).map(m=>m.name);
    if(users.length&&!confirm(`${users.join(', ')} depend${users.length>1?'':'s'} on ${n}. Remove anyway? They will fail validation.`))return;B.spec.metrics.splice(+i,1);touch();renderMetrics()},
  addinput({i}){(B.spec.metrics[+i].inputs??=[]).push({name:'',alias:'',offset_window:''});touch();renderMetrics()},
  rminput({i,j}){B.spec.metrics[+i].inputs.splice(+j,1);touch();renderMetrics()},
  template({i,kind}){const m=B.spec.metrics[+i];
    if(kind==='growth'){m.type='derived';m.expr='(base - prior) / prior';m.inputs=[{name:m.inputs?.[0]?.name||'',alias:'base',offset_window:''},{name:m.inputs?.[0]?.name||'',alias:'prior',offset_window:'1 month'}]}
    touch();renderMetrics()},
};
function blankMetric(type){return {name:'',type,description:'',...(type==='simple'||type==='cumulative'?{measure:'',filter:''}:{}),...(type==='ratio'?{numerator:'',denominator:''}:{}),...(type==='derived'?{expr:'',inputs:[{name:'',alias:'',offset_window:''}]}:{}),...(type==='cumulative'?{window:'',grain_to_date:''}:{})}}
function dependsOn(m){return m.type==='ratio'?[m.numerator,m.denominator]:m.type==='derived'?(m.inputs||[]).map(x=>x.name):[]}
function depth(name,seen=new Set()){const m=B.spec.metrics.find(x=>x.name===name);if(!m||seen.has(name))return 0;seen.add(name);return dependsOn(m).length?1+Math.max(...dependsOn(m).map(n=>depth(n,new Set(seen)))):0}

/* Metrics tab */
function renderMetrics(){
  const root=$('#view-metrics');
  const measures=B.spec.semantic_models.flatMap(m=>(m.measures||[]).filter(x=>x.name).map(x=>[x.name,`${x.name}  (${m.name}: ${x.agg})`]));
  const metricsNames=i=>B.spec.metrics.filter((_,k)=>k!==i&&_.name).map(m=>[m.name,`${m.name}  (${m.type})`]);
  const cards=B.spec.metrics.map((m,i)=>{
    const P=`metrics.${i}`,others=metricsNames(i),deps=dependsOn(m).filter(Boolean),d=depth(m.name);
    let body='';
    if(m.type==='simple'||m.type==='cumulative')body=`<div class="grid">${sel(P+'.measure','Measure',measures,'Select a measure')}${m.type==='simple'?inp(P+'.filter','Filter (optional)',"{{ Dimension('order__status') }} = 'paid'"):inp(P+'.window','Window (e.g. 7 days)','7 days')+sel(P+'.grain_to_date','…or grain to date',B.opts.grains,'(none)')}</div>`;
    else if(m.type==='ratio')body=`<div class="grid">${sel(P+'.numerator','Numerator metric',others,'Select a metric')}${sel(P+'.denominator','Denominator metric',others,'Select a metric')}</div>`;
    else body=`${inp(P+'.expr','Expression over the inputs below','revenue - cost')}<h2>Input metrics <span class="muted">use the alias (or name) in the expression</span></h2>
      ${(m.inputs||[]).map((x,j)=>`<div class="line inp"><select data-p="${P}.inputs.${j}.name">${opt(others,x.name,'Select a metric')}</select><input data-p="${P}.inputs.${j}.alias" value="${esc(x.alias||'')}" placeholder="alias"><input data-p="${P}.inputs.${j}.offset_window" value="${esc(x.offset_window||'')}" placeholder="offset e.g. 1 month"><button class="sm x" data-act="rminput" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
      <button class="sm" data-act="addinput" data-i="${i}">+ Input metric</button> <button class="sm" data-act="template" data-i="${i}" data-kind="growth" title="Fill in growth vs a prior period">Growth vs prior period</button>`;
    return `<div class="card"><h3>${esc(m.name)||'(unnamed metric)'} <span class="badge">${esc(m.type)}</span>${d?`<span class="badge" title="stacked on other metrics">level ${d+1}</span>`:''}<span style="flex:1"></span><button class="sm x" data-act="rmmetric" data-i="${i}">Remove</button></h3>
      <div class="grid">${inp(P+'.name','Name','revenue')}${inp(P+'.description','Description','')}</div><div style="height:8px"></div>${body}
      ${deps.length?`<div class="tree">built on: ${deps.map(x=>`<code class="k">${esc(x)}</code>`).join(' ')}</div>`:''}</div>`}).join('')||'<p class="muted">No metrics yet. Add one below, or model a table on the Data tab to get starter metrics.</p>';
  root.innerHTML=`<h2>Metrics</h2>${cards}
    <div class="card"><h3>Add a metric</h3><div class="chips">
      <button class="sm" data-act="newmetric" data-type="simple">Simple <span class="muted">aggregate a measure</span></button>
      <button class="sm" data-act="newmetric" data-type="ratio">Ratio <span class="muted">metric ÷ metric</span></button>
      <button class="sm" data-act="newmetric" data-type="derived">Derived <span class="muted">formula over metrics</span></button>
      <button class="sm" data-act="newmetric" data-type="cumulative">Cumulative <span class="muted">running total</span></button></div>
      <p class="muted" style="margin:8px 0 0">Ratio and derived metrics take other metrics as inputs, including other ratio or derived metrics, so you can stack them (revenue → average order value → net AOV).</p></div>`;
  bindInputs(root);
}

/* navigation + load/save */
function show(view){B.view=view;
  for(const v of ['explore','data','metrics'])$(`#view-${v}`).hidden=v!==view;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  if(view==='data')renderData();if(view==='metrics')renderMetrics();barUpdate();
  if(view==='explore')reloadCatalog();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#show-yaml').onclick=()=>{$('#yaml').hidden=!$('#yaml').hidden;$('#show-yaml').textContent=$('#yaml').hidden?'View YAML':'Hide YAML'};
$('#save').onclick=async()=>{
  $('#save').disabled=true;const r=await api2('/builder/model','PUT',{spec:B.spec});
  if(r.ok&&r.json.saved){B.dirty=false;B.issues=r.json.issues;await loadState(false);reloadCatalog();$('#bar-status').innerHTML='<span class="ok">Saved and applied. Switch to Explore to query it.</span>'}
  else{B.issues=r.json.issues||[{level:'error',message:r.json.error?.message||'Save failed'}];barUpdate()}
};
async function api2(path,method,body){const r=await fetch(path,{method,headers:{'content-type':'application/json'},body:JSON.stringify(body)});return {ok:r.ok,json:await r.json()}}
async function loadState(keepSpec){
  const r=await api('/builder/state');if(!r.ok)return false;
  B.on=true;B.tables=r.json.tables;B.opts=r.json.options;B.yaml=r.json.yaml;
  if(!keepSpec){B.spec=r.json.spec;B.issues=r.json.issues}
  document.querySelectorAll('#nav [hidden]').forEach(b=>b.hidden=false);
  if(B.view==='data')renderData();if(B.view==='metrics')renderMetrics();barUpdate();return true;
}
async function reloadCatalog(){
  const c=await api('/explorer/catalog');
  if(c.ok){state.metrics=c.json.metrics;state.selected=new Set([...state.selected].filter(n=>state.metrics.some(m=>m.name===n)));
    $('#summary').textContent=c.json.empty?'No model yet: open "Data & models"':`${state.metrics.length} metrics`;renderMetrics_explore();}
}

(async()=>{
  await loadState(false);
  if(B.on&&!B.spec.metrics.length&&!B.spec.semantic_models.length)setTimeout(()=>show('data'),0);
  const [c,l]=await Promise.all([api('/explorer/catalog'),api('/lineage')]);
  if(!c.ok){state.error=c.json;view();$('#metrics').textContent='Failed to load catalog';return}
  state.metrics=c.json.metrics; state.lineage=l.json; $('#summary').textContent=`${state.metrics.length} metrics`;
  renderMetrics_explore(); view();
})();
</script>
</body>
